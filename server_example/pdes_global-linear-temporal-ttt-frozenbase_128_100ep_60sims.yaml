data_dir: ~/working/datasets
run_root: ~/working/runs_global_linear_temporal
run_name: pdes_global-linear-temporal-ttt-frozenbase_128_100ep_60sims

model_type: PDE-S
in_channels: 2
out_channels: 2
patch_size: 4
periodic: true
carrier_token_active: false

token_mixer_type: global_linear_ttt
vittt_inner_lr: 1.0
vittt_head_dim: 32

temporal_ttt_enabled: true
temporal_ttt_layer_type: mlp
temporal_ttt_mini_batch_size: 64
temporal_ttt_base_lr: 1.0
temporal_ttt_gate_init: 0.1
temporal_ttt_use_output_gate: false
temporal_ttt_scan_checkpoint_group_size: 0
temporal_ttt_learning_rate: 1.0e-4

freeze_backbone: true
init_checkpoint: ~/working/runs_global_vittt/pdes_global-linear-ttt_128_60sims_100ep/checkpoints/epoch-epoch=094.ckpt
learning_rate: 0.0

max_epochs: 100
batch_size: 1
num_workers: 2
devices: 2
strategy: ddp_find_unused_parameters_true
precision: 32-true
accumulate_grad_batches: 8
seed: 42

downsample_factor: 2
sample_size: 128
train_unrolling_steps: 29
train_step_size: 1
tbptt_chunk_size: 4
test_unrolling_steps: 29
max_channels: 2
auto_resume: true
